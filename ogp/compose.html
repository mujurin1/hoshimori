<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<style>
@font-face { font-family: "MPR"; font-weight: 800; src: url("../game/fonts/MPLUSRounded1c-ExtraBold.ttf"); }
@font-face { font-family: "MPR"; font-weight: 700; src: url("../game/fonts/MPLUSRounded1c-Bold.ttf"); }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: #05081a; font-family: "MPR"; }
.bg { position: absolute; inset: 0; width: 1200px; height: 630px; }
/* 縮小表示でも主役が沈まないよう、四隅だけ落として中央と題字へ目を寄せる */
.shade { position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 75% 85% at 62% 62%, rgba(4,6,30,0) 55%, rgba(4,6,30,.55) 100%),
    linear-gradient(115deg, rgba(6,8,40,.45) 0%, rgba(6,8,40,0) 45%); }
.title { position: absolute; left: 64px; top: 34px; font-weight: 800; font-size: 168px; line-height: 1.25; letter-spacing: 0.04em; white-space: nowrap; }
.title span { position: absolute; left: 0; top: 0; }
.title .edge { color: #262a7a; -webkit-text-stroke: 30px #262a7a; filter: drop-shadow(0 10px 0 rgba(8,8,40,.75)) drop-shadow(0 0 26px rgba(255,214,120,.35)); }
.title .face { background: linear-gradient(180deg, #fffbe0 18%, #ffe07a 58%, #ffb65c 92%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.catch { position: absolute; left: 76px; top: 262px; font-weight: 800; font-size: 37px; letter-spacing: 0.06em; color: #f1f5ff; white-space: nowrap;
  -webkit-text-stroke: 9px rgba(16,18,70,.92); paint-order: stroke fill; }
.star { position: absolute; left: 742px; top: 44px; width: 92px; height: 92px; transform: rotate(12deg); overflow: visible; filter: drop-shadow(0 0 14px rgba(255,220,130,.7)); }
.star path { fill: #fff3b8; stroke: #262a7a; stroke-width: 9; stroke-linejoin: round; paint-order: stroke fill; }
</style>
<img class="bg" src="build/render.png">
<div class="shade"></div>
<div class="title"><span class="edge">ほしもり</span><span class="face">ほしもり</span></div>
<svg class="star" viewBox="-60 -60 120 120"><path d="M0-46 Q6-6 46 0 Q6 6 0 46 Q-6 6 -46 0 Q-6-6 0-46Z"/></svg>
<div class="catch">小さな星で、夜明けまで生きのびろ。</div>
</html>
